<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flight Price Prediction</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .header {
            background-color: #343a40;
            color: white;
            text-align: center;
            padding: 8px;
            margin: 0;
        }

        .header h4 {
            margin: 0;
            font-size: 20px;
        }

        .main-container {
            max-width: 750px;
            margin: 15px auto;
            padding: 15px;
            background-color: white;
            border-radius: 6px;
        }

        .row {
            margin-bottom: 10px;
        }

        .card {
            height: 100%;
        }

        .card-body {
            padding: 10px;
        }

        .card-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-control {
            height: 35px;
            font-size: 14px;
            padding: 5px 8px;
        }

        .btn {
            padding: 7px 30px;
            font-size: 14px;
        }

        .prediction {
            text-align: center;
            margin-top: 15px;
        }

        .prediction h4 {
            font-size: 18px;
        }
    </style>
</head>


<body>

    <!-- Small Header -->
    <div class="header">
        <h4>Flight Price Prediction</h4>
    </div>


    <div class="main-container">

        <form action="/predict" method="post">

            <!-- Row 1 -->
            <div class="row">

                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">

                            <h5 class="card-title">Departure Date</h5>

                            <input type="datetime-local"
                                   name="Dep_Time"
                                   class="form-control"
                                   required>

                        </div>
                    </div>
                </div>


                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">

                            <h5 class="card-title">Arrival Date</h5>

                            <input type="datetime-local"
                                   name="Arrival_Time"
                                   class="form-control"
                                   required>

                        </div>
                    </div>
                </div>

            </div>


            <!-- Row 2 -->
            <div class="row">

                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">

                            <h5 class="card-title">Source</h5>

                            <select name="Source"
                                    class="form-control"
                                    required>

                                <option value="Banglore">Banglore</option>
                                <option value="Chennai">Chennai</option>
                                <option value="Cochin">Cochin</option>
                                <option value="Delhi">Delhi</option>
                                <option value="Hyderabad">Hyderabad</option>
                                <option value="Kolkata">Kolkata</option>
                                <option value="Mumbai">Mumbai</option>

                            </select>

                        </div>
                    </div>
                </div>


                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">

                            <h5 class="card-title">Destination</h5>

                            <select name="Destination"
                                    class="form-control"
                                    required>

                                <option value="Banglore">Banglore</option>
                                <option value="Chennai">Chennai</option>
                                <option value="Cochin">Cochin</option>
                                <option value="Delhi">Delhi</option>
                                <option value="Hyderabad">Hyderabad</option>
                                <option value="Kolkata">Kolkata</option>
                                <option value="Mumbai">Mumbai</option>

                            </select>

                        </div>
                    </div>
                </div>

            </div>


            <!-- Row 3 -->
            <div class="row">

                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">

                            <h5 class="card-title">Stops</h5>

                            <select name="Total_Stops"
                                    class="form-control"
                                    required>

                                <option value="non-stop">Non-stop</option>
                                <option value="1 stop">1 Stop</option>
                                <option value="2 stops">2 Stops</option>
                                <option value="3 stops">3 Stops</option>
                                <option value="4 stops">4 Stops</option>

                            </select>

                        </div>
                    </div>
                </div>


                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">

                            <h5 class="card-title">Airline</h5>

                            <select name="Airline"
                                    class="form-control"
                                    required>

                                <option value="Jet Airways">Jet Airways</option>
                                <option value="IndiGo">IndiGo</option>
                                <option value="Air India">Air India</option>
                                <option value="Multiple carriers">
                                    Multiple carriers
                                </option>
                                <option value="SpiceJet">SpiceJet</option>
                                <option value="Vistara">Vistara</option>
                                <option value="Air Asia">Air Asia</option>
                                <option value="GoAir">GoAir</option>
                                <option value="Multiple carriers Premium economy">
                                    Multiple carriers Premium economy
                                </option>
                                <option value="Jet Airways Business">
                                    Jet Airways Business
                                </option>
                                <option value="Vistara Premium economy">
                                    Vistara Premium economy
                                </option>
                                <option value="Trujet">Trujet</option>

                            </select>

                        </div>
                    </div>
                </div>

            </div>


            <!-- Submit -->
            <div class="text-center mt-2">

                <button type="submit"
                        class="btn btn-primary">

                    Predict Price

                </button>

            </div>

        </form>


        <!-- Prediction Result -->
        <div class="prediction">

            <h4>{{ prediction_text }}</h4>

        </div>

    </div>

</body>

</html>
